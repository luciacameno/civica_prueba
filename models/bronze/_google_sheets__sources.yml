version: 2

sources:
  - name: google_sheets
    database: DEV_BRONZE_DB
    schema: google_sheets
    tables:
      - name: budget
        columns:
          - name: _row
            tests:
              - unique
              - not_null
          - name: product_id
            tests:
              - relationships:
                  arguments:
                    to: ref('slv_sql_server_dbo__products')
                    field: product_id
          - name : quantity
            tests:
              - positive_values